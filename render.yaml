# Disposable mobile preview, explicitly authorized by the owner. Startup loads published
# reference data and runs the data scheduler beside the web server, so open sources (ECB
# FX, SONIA, €STR, SOFR) load at once and keyed ones when their key is set below. No
# production data, no simulated prices. Keys are entered in Render, never in this file.
services:
  - type: web
    name: eurogas-mobile-preview
    runtime: python
    branch: main
    # Deploy main only after its GitHub CI checks pass.
    autoDeployTrigger: checksPass
    plan: free
    region: ohio
    buildCommand: bash scripts/uat/build_mobile_preview.sh
    startCommand: python scripts/uat/start_mobile_preview.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.12
      - key: NODE_VERSION
        value: 24.13.1
      - key: PYTHONPATH
        value: src:packages/python-sdk/src:.
      - key: EUROGAS_NEXUS_MOBILE_PREVIEW
        value: "1"
      - key: EUROGAS_NEXUS_ENV
        value: test
      - key: EUROGAS_NEXUS_API_PROFILE
        value: development
      - key: EUROGAS_NEXUS_UAT_FIXTURE_ALLOWED
        value: "1"
      - key: EUROGAS_NEXUS_ALLOW_ANONYMOUS_CALLERS
        value: "0"
      - key: EUROGAS_NEXUS_ENABLE_SIMULATED_SOURCES
        value: "0"
      - key: EUROGAS_NEXUS_LLM_EXTERNAL_PROVIDER_ENABLED
        value: "0"
      - key: EUROGAS_NEXUS_DB_POOL_SIZE
        value: "2"
      - key: EUROGAS_NEXUS_DB_MAX_OVERFLOW
        value: "1"
      - key: EUROGAS_NEXUS_DEV_LOGIN_USERNAME
        value: mobile-tester
      - key: EUROGAS_NEXUS_DEV_LOGIN_PASSWORD
        generateValue: true
      - key: EUROGAS_NEXUS_PUBLIC_API_TOKEN
        generateValue: true
      - key: EUROGAS_NEXUS_SECRET_KEY
        generateValue: true
      # Render's public service is reachable only through its TLS-terminating ingress.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Provider keys: Render asks for these on the first Blueprint apply; leave a key
      # empty to skip that source. ENTSOG and GIE also need a certification record.
      - key: EIA_API_KEY
        sync: false
      - key: ENTSOE_SECURITY_TOKEN
        sync: false
      - key: GIE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: eurogas-mobile-preview-db
          property: connectionString
databases:
  - name: eurogas-mobile-preview-db
    plan: free
    region: ohio
