# Weekdays on which an exchange the desk trades on is closed (exchange holidays).
#
# THE FALLBACK ONLY (2026-11-28). The exchanges' own calendars are now fetched under the
# publishers' written consent reported by the owner on 2026-11-28 (EEX's natural gas trading
# calendar and holiday calendar, ICE Endex's and ICE Futures Europe's trading schedules:
# docs/legal/DATA_SOURCE_TERMS.md, "Written consents reported by the owner, 2026-11-28";
# domain/publications/registry.py). For every year an exchange's fetched calendar covers, its
# days replace this file's on Desk -> Board (Calendar), in the notifications and in the daily
# pack; this file is used for the years and venues nothing has been read for yet, and if an
# administrator withdraws a consent before anything was fetched. Each venue names the
# publisher's own page (`check_url`) and a day to compare this list with it by (`check_by`):
# the product reminds the desk only while it has not read that exchange's calendar.
#
# `checked = false` means no person on the desk has compared the list with the publisher's page
# for the years given. A year not listed under `years` is treated as Monday to Friday, and the
# daily pack says the calendar does not cover it.
#
# A desk copy of this file (same file name) in the folder named by
# EUROGAS_NEXUS_DEAL_FORMATS_DIR replaces this one.
#
# Used by the daily pack's check "no deals on a trading day": a day is a trading day when it is
# a weekday and at least one venue below is open. Saturdays and Sundays are never trading days
# for the desk's derivatives (exchange spot markets trade every day and are not listed).

years = [2026, 2027]

[venue.EEX]
title = "EEX natural gas derivatives"
source = "EEX trading calendar, derivatives market (eex.com, Trading Calendar)"
check_url = "https://www.eex.com/en/trading-resources/trading-information/calendar"
check_by = "2026-12-15"
checked = false
non_trading_days = [
    "2026-01-01",  # New Year's Day
    "2026-04-03",  # Good Friday
    "2026-04-06",  # Easter Monday
    "2026-05-01",  # Labour Day
    "2026-12-25",  # Christmas Day
    "2027-01-01",  # New Year's Day
    "2027-03-26",  # Good Friday
    "2027-03-29",  # Easter Monday
]

# Settled from EEX's own Holiday Calendar (Derivatives & Emissions Spot, read 2026-11-28): "Gas
# and Freight derivatives are offered for trading on 24th and 31st December from 08:00 am to
# 13:00 CET"; "applicable continuously for all years". Shorter hours, not closed days.
[venue.EEX.early_closes]
"2026-12-24" = "gas derivatives trade 08:00-13:00 CET only"
"2026-12-31" = "gas derivatives trade 08:00-13:00 CET only"
"2027-12-24" = "gas derivatives trade 08:00-13:00 CET only"
"2027-12-31" = "gas derivatives trade 08:00-13:00 CET only"

[venue.ICE_ENDEX]
title = "ICE Endex gas futures (TTF, THE, ZTP, PEG)"
source = "ICE Endex Trading Schedule (ice.com/publicdocs, v1.0 October 2026)"
check_url = "https://www.ice.com/publicdocs/ICE_Endex_Trading_Schedule.pdf"
check_by = "2026-12-15"
checked = false
non_trading_days = [
    "2026-01-01",  # New Year's Day
    "2026-04-03",  # Good Friday
    "2026-04-06",  # Easter Monday
    "2026-12-25",  # Christmas Day
    "2027-01-01",  # New Year's Day
    "2027-03-26",  # Good Friday
    "2027-03-29",  # Easter Monday
]

[venue.ICE_ENDEX.early_closes]
"2026-12-24" = "Christmas Eve: early settlement period"
"2026-12-31" = "New Year's Eve: early settlement period"
"2027-12-24" = "Christmas Eve: early settlement period"
"2027-12-31" = "New Year's Eve: early settlement period"

[venue.ICE_FUTURES_EUROPE]
title = "ICE Futures Europe UK natural gas (NBP)"
source = "IFEU Trading Schedule: Oil, Utilities and Agricultural (ice.com/publicdocs, November 2026)"
check_url = "https://www.ice.com/publicdocs/Trading_Schedule.pdf"
check_by = "2026-12-15"
checked = false
non_trading_days = [
    "2026-01-01",  # New Year's Day
    "2026-04-03",  # Good Friday
    "2026-04-06",  # Easter Monday (UK natural gas closed)
    "2026-05-04",  # May Day (UK natural gas closed)
    "2026-05-25",  # Spring Bank Holiday (UK natural gas closed)
    "2026-08-31",  # Summer Bank Holiday (UK natural gas closed)
    "2026-12-25",  # Christmas Day
    "2026-12-28",  # Boxing Day, observed (UK natural gas closed)
    "2027-01-01",  # New Year's Day
    "2027-03-26",  # Good Friday
    "2027-03-29",  # Easter Monday (UK natural gas closed)
    "2027-05-03",  # May Day (UK natural gas closed)
    "2027-05-31",  # Spring Bank Holiday (UK natural gas closed)
    "2027-08-30",  # Summer Bank Holiday (UK natural gas closed)
    "2027-12-27",  # Christmas Day, observed (UK natural gas closed)
    "2027-12-28",  # Boxing Day, observed (UK natural gas closed)
]

[venue.ICE_FUTURES_EUROPE.early_closes]
