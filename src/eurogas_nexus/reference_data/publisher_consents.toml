# Written consents to use publicly available data, as reported by the owner on 2026-11-28.
#
# The owner contacted each publisher below and reports that each gave written consent to use
# the data it makes publicly available, "so long as those data are used by us and we're not
# reselling them". The owner holds the written consents and hands them to the desk's
# organisation at go-live. The development team has not seen the documents.
#
# These records are data, not code: a publication whose website terms forbid storing it is
# fetched only while its publisher has a record here that an administrator has not withdrawn
# (Admin -> Data sources -> Watched publications; withdrawal is audited and stops fetching at
# once). The legal register's section "Written consents reported by the owner, 2026-11-28"
# (docs/legal/DATA_SOURCE_TERMS.md) states each record and the earlier finding it supersedes.
#
# Scope, enforced by the product (security/identity, governance/entitlement):
#   - publicly available data only: nothing behind a login, an account or a paywall;
#   - the firm's own use: read by the firm's own authenticated users and in the daily packs to
#     the firm's own managers and risk function;
#   - no resale or redistribution: never in a file or report meant for outside the firm, never
#     to an anonymous caller, whatever a licence record says.
#
# `families` are the source systems the product stores this publisher's fetched prices under.

reported_on = "2026-11-28"
scope = "publicly available data; the firm's own use; no resale or redistribution"
basis = "written consent held by the owner; not seen by the development team"

