<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eurogas Nexus</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: linear-gradient(180deg, #101c34 0%, #0b1324 100%);
    color: #ffffff;
    font-family: Inter, "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }
  main { display: grid; justify-items: center; gap: 14px; }
  .mark { width: 56px; height: 56px; animation: rise 520ms cubic-bezier(.2,0,0,1) both; }
  h1 { margin: 6px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; color: #9aa7bd; font-size: 12px; letter-spacing: 0.02em; }
  .bar { width: 160px; height: 2px; margin-top: 10px; overflow: hidden; border-radius: 2px; background: rgba(255,255,255,.08); }
  .bar span { display: block; width: 40%; height: 100%; border-radius: 2px; background: #6ea8fe; animation: slide 1.4s cubic-bezier(.4,0,.2,1) infinite; }
  footer { position: fixed; bottom: 14px; color: #5f6d86; font-size: 10px; }
  @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
  @keyframes rise { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .mark { animation: none; }
    .bar span { animation: none; width: 100%; opacity: .5; }
  }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><g fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="butt"><path class="egn-hex" d="M3.876 16.5V9L16 2L28.124 9V10.5" stroke="#ffffff"/><path class="egn-hex" d="M28.124 15.5V23L16 30L3.876 23V21.5" stroke="#ffffff"/><path class="egn-wave" d="M1.5 19H5C15 19 17 13 27 13H30.5" stroke="#6ea8fe"/></g></svg>
  <h1>Eurogas Nexus</h1>
  <p>Opening your workspace</p>
  <div class="bar" role="progressbar" aria-label="Loading"><span></span></div>
</main>
<footer>European gas trading workstation · decision support</footer>
</body>
</html>
