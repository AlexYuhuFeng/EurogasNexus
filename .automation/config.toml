[project]
checkpoint = "docs/engineering/ARCHITECTURE_V2_EXECUTION_STATE.md"
required_branch = "architecture-v2-autonomous"
enforce_required_branch = true

[codex]
binary = "codex"
model = "gpt-6-astra"
reasoning_effort = "low"
sandbox_mode = "workspace-write"
approval_policy = "never"
resume_session = false
max_resumes_per_session = 0
turn_timeout_seconds = 10800

[worker]
model = "deepseek-v4-flash"
reasoning_effort = "high"
sandbox_mode = "workspace-write"
approval_policy = "never"
turn_timeout_seconds = 10800
runtime = "bridge"

[loop]
success_sleep_seconds = 15
transient_retry_seconds = 120
max_consecutive_failures = 4

[allowance]
probe_interval_seconds = 1800
minimum_wait_seconds = 600
reset_grace_seconds = 120
max_parsed_wait_seconds = 691200

[automation]
active_node_id = "windows-primary"
auto_commit_after_accept = false
