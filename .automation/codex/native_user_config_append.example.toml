# OPTIONAL native cross-provider role. Bridge mode does not need this.
# Append to USER-level ~/.codex/config.toml only after backup.

[model_providers.deepseek]
name = "deepseek"
base_url = "https://api.deepseek.com/"
env_key = "DEEPSEEK_API_KEY"
wire_api = "responses"
requires_openai_auth = false

[agents.deepseek_worker]
description = "Bounded Eurogas Nexus implementation worker using DeepSeek Flash V4.1."
config_file = "agents/eurogas-deepseek-worker.toml"
