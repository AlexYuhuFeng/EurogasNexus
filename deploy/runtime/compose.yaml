name: eurogas-nexus-runtime

x-runtime-environment: &runtime-environment
  RUNTIME_STORE_DATABASE_URL: postgresql+pg8000://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  EUROGAS_NEXUS_ENV: release
  EUROGAS_NEXUS_API_PROFILE: release
  EUROGAS_NEXUS_VERSION: ${EUROGAS_NEXUS_VERSION}
  EUROGAS_NEXUS_SECRET_KEY: ${EUROGAS_NEXUS_SECRET_KEY}
  EUROGAS_NEXUS_INTERNAL_API_TOKEN: ${EUROGAS_NEXUS_INTERNAL_API_TOKEN}
  EUROGAS_NEXUS_PUBLIC_API_TOKEN: ${EUROGAS_NEXUS_PUBLIC_API_TOKEN}
  EUROGAS_NEXUS_OIDC_ISSUER: ${EUROGAS_NEXUS_OIDC_ISSUER:-}
  EUROGAS_NEXUS_OIDC_CLIENT_ID: ${EUROGAS_NEXUS_OIDC_CLIENT_ID:-}
  EUROGAS_NEXUS_OIDC_CLIENT_SECRET: ${EUROGAS_NEXUS_OIDC_CLIENT_SECRET:-}
  EUROGAS_NEXUS_OIDC_REDIRECT_URI: ${EUROGAS_NEXUS_OIDC_REDIRECT_URI:-}
  EUROGAS_NEXUS_OIDC_AUDIENCE: ${EUROGAS_NEXUS_OIDC_AUDIENCE:-}
  EUROGAS_NEXUS_OIDC_ROLE_CLAIM: ${EUROGAS_NEXUS_OIDC_ROLE_CLAIM:-roles}
  EUROGAS_NEXUS_OIDC_SCOPE_CLAIM: ${EUROGAS_NEXUS_OIDC_SCOPE_CLAIM:-entitlements}
  EUROGAS_NEXUS_OIDC_PROVISIONING_MODE: ${EUROGAS_NEXUS_OIDC_PROVISIONING_MODE:-preprovisioned}
  EUROGAS_NEXUS_OIDC_APPROVED_DOMAINS: ${EUROGAS_NEXUS_OIDC_APPROVED_DOMAINS:-}
  EUROGAS_NEXUS_OIDC_GROUPS_ROLE_MAP: ${EUROGAS_NEXUS_OIDC_GROUPS_ROLE_MAP:-}
  EUROGAS_NEXUS_OIDC_GROUPS_SCOPE_MAP: ${EUROGAS_NEXUS_OIDC_GROUPS_SCOPE_MAP:-}
  EUROGAS_NEXUS_OIDC_ALLOW_HTTP: ${EUROGAS_NEXUS_OIDC_ALLOW_HTTP:-0}
  # The gateway terminates TLS and proxies to api:8000 over the container
  # network, so uvicorn must trust that hop's X-Forwarded-Proto. Its default
  # (127.0.0.1,::1) excludes the sidecar proxy, which would leave every request
  # looking like plain http: the session cookie would then be issued without
  # Secure, and the origin guard could not derive the browser's real origin.
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - runtime-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  config-check:
    # Refuses to let the stack come up on a misconfigured environment. This runs
    # in the application image because the check reads the same contract the
    # service does; a missing credential key or a half-configured OIDC block would
    # otherwise surface only when a user first hits the affected feature.
    #
    # Errors block the stack; warnings do not. Warnings describe a deployment that
    # can serve correctly but that a release gate should still question (an
    # unrotatable credential key, an undeclared trusted proxy), so they are raised
    # by `--strict` in CI rather than by refusing to start here.
    image: ${EUROGAS_NEXUS_API_IMAGE}
    environment: *runtime-environment
    command: ["python", "scripts/ops/check_config.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate:
    image: ${EUROGAS_NEXUS_API_IMAGE}
    environment: *runtime-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
      config-check:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: ${EUROGAS_NEXUS_API_IMAGE}
    restart: unless-stopped
    environment: *runtime-environment
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The token is read from the container's own environment rather than
      # interpolated here: an interpolated value would appear in `docker inspect`
      # output and in the process list.
      test:
        - CMD
        - python
        - -c
        - "import json,os,urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/api/health/ready'); req.add_header('X-Eurogas-Api-Key', os.environ['EUROGAS_NEXUS_PUBLIC_API_TOKEN']); assert json.load(urllib.request.urlopen(req, timeout=3))['status'] == 'ready'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  gateway:
    image: caddy:2-alpine
    profiles: ["server"]
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME}
    ports:
      - "${HTTPS_BIND_ADDRESS}:${HTTPS_PORT}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/caddy/tls:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --no-check-certificate --header='Host: '$${SERVER_NAME} --spider https://127.0.0.1/api/health"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  public-ingestion:
    image: ${EUROGAS_NEXUS_API_IMAGE}
    profiles: ["tools"]
    environment: *runtime-environment
    command:
      - python
      - scripts/ops/ingest_public_sources.py
      - --source
      - ecb
      - --source
      - entsog
      - --source
      - entsog-capacity
      - --source
      - entsog-reference
      - --limit
      - "10000"
      - --json
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  public-ingestion-worker:
    image: ${EUROGAS_NEXUS_API_IMAGE}
    profiles: ["public-ingestion"]
    restart: unless-stopped
    environment: *runtime-environment
    command:
      - python
      - scripts/ops/run_public_ingestion_worker.py
      - --source
      - ecb
      - --source
      - entsog
      - --source
      - entsog-capacity
      - --source
      - gie-agsi
      - --source
      - gie-alsi
      - --limit
      - "10000"
      - --interval-seconds
      - "1800"
    depends_on:
      migrate:
        condition: service_completed_successfully

  reference-ingestion-worker:
    image: ${EUROGAS_NEXUS_API_IMAGE}
    profiles: ["public-ingestion"]
    restart: unless-stopped
    environment: *runtime-environment
    command:
      - python
      - scripts/ops/run_public_ingestion_worker.py
      - --source
      - entsog-reference
      - --limit
      - "10000"
      - --interval-seconds
      - "86400"
    depends_on:
      migrate:
        condition: service_completed_successfully

  monitoring-worker:
    image: ${EUROGAS_NEXUS_API_IMAGE}
    profiles: ["monitoring"]
    restart: unless-stopped
    environment: *runtime-environment
    command:
      - python
      - scripts/ops/run_monitoring_worker.py
      - --interval-seconds
      - "10"
      - --max-llm-enrichments
      - "3"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  runtime-postgres:
    name: eurogas-nexus-runtime-postgres
