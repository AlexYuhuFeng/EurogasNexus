name: eurogas-nexus-runtime

# Every service receives only the settings it needs (security review H3/M8): the database
# and the environment for all; the credential-encryption key for the services that call a
# provider; the deployment token and the SSO client secret for the API alone. The internal
# API token is not set here at all: the release profile does not mount the internal routes.
x-db-environment: &db-environment
  RUNTIME_STORE_DATABASE_URL: postgresql+pg8000://${EUROGAS_NEXUS_APP_DB_USER:-${POSTGRES_USER}}:${EUROGAS_NEXUS_APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB}
  # Per process (docs/operations/API_SERVING_AND_SHARED_CACHE.md has the sizing formula).
  EUROGAS_NEXUS_DB_POOL_SIZE: ${EUROGAS_NEXUS_DB_POOL_SIZE:-10}
  EUROGAS_NEXUS_DB_MAX_OVERFLOW: ${EUROGAS_NEXUS_DB_MAX_OVERFLOW:-20}
  EUROGAS_NEXUS_ENV: release
  EUROGAS_NEXUS_API_PROFILE: release
  EUROGAS_NEXUS_VERSION: ${EUROGAS_NEXUS_VERSION}
  # Every service writes audit rows: each is sealed and forwarded to the SIEM (H5).
  EUROGAS_NEXUS_AUDIT_SINK: ${EUROGAS_NEXUS_AUDIT_SINK:-}
  EUROGAS_NEXUS_AUDIT_RETENTION_DAYS: ${EUROGAS_NEXUS_AUDIT_RETENTION_DAYS:-1827}

# Migrations run as the schema owner; the services connect as the application role, which
# has no UPDATE or DELETE on the audit trail (docs/security/DATABASE_ROLES.md). Until the
# roles are created both fall back to POSTGRES_USER.
x-migrate-environment: &migrate-environment
  RUNTIME_STORE_DATABASE_URL: postgresql+pg8000://${EUROGAS_NEXUS_OWNER_DB_USER:-${POSTGRES_USER}}:${EUROGAS_NEXUS_OWNER_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB}
  EUROGAS_NEXUS_ENV: release
  EUROGAS_NEXUS_API_PROFILE: release
  EUROGAS_NEXUS_VERSION: ${EUROGAS_NEXUS_VERSION}

x-provider-environment: &provider-environment
  <<: *db-environment
  EUROGAS_NEXUS_SECRET_KEY: ${EUROGAS_NEXUS_SECRET_KEY}
  EUROGAS_NEXUS_SECRET_KEY_PREVIOUS: ${EUROGAS_NEXUS_SECRET_KEY_PREVIOUS:-}
  EUROGAS_NEXUS_ALERT_EMAIL_DOMAINS: ${EUROGAS_NEXUS_ALERT_EMAIL_DOMAINS:-}

x-runtime-environment: &runtime-environment
  <<: *provider-environment
  EUROGAS_NEXUS_PUBLIC_API_TOKEN: ${EUROGAS_NEXUS_PUBLIC_API_TOKEN}
  EUROGAS_NEXUS_PUBLIC_API_TOKEN_PREVIOUS: ${EUROGAS_NEXUS_PUBLIC_API_TOKEN_PREVIOUS:-}
  EUROGAS_NEXUS_PUBLIC_API_TOKEN_MODE: ${EUROGAS_NEXUS_PUBLIC_API_TOKEN_MODE:-service}
  EUROGAS_NEXUS_PUBLIC_API_TOKEN_ROLE: ${EUROGAS_NEXUS_PUBLIC_API_TOKEN_ROLE:-VIEWER}
  EUROGAS_NEXUS_PUBLIC_API_TOKEN_SCOPES: ${EUROGAS_NEXUS_PUBLIC_API_TOKEN_SCOPES:-}
  EUROGAS_NEXUS_OIDC_ISSUER: ${EUROGAS_NEXUS_OIDC_ISSUER:-}
  EUROGAS_NEXUS_OIDC_CLIENT_ID: ${EUROGAS_NEXUS_OIDC_CLIENT_ID:-}
  EUROGAS_NEXUS_OIDC_CLIENT_SECRET: ${EUROGAS_NEXUS_OIDC_CLIENT_SECRET:-}
  EUROGAS_NEXUS_OIDC_REDIRECT_URI: ${EUROGAS_NEXUS_OIDC_REDIRECT_URI:-}
  EUROGAS_NEXUS_OIDC_AUDIENCE: ${EUROGAS_NEXUS_OIDC_AUDIENCE:-}
  EUROGAS_NEXUS_OIDC_ROLE_CLAIM: ${EUROGAS_NEXUS_OIDC_ROLE_CLAIM:-roles}
  EUROGAS_NEXUS_OIDC_SCOPE_CLAIM: ${EUROGAS_NEXUS_OIDC_SCOPE_CLAIM:-}
  EUROGAS_NEXUS_OIDC_PROVISIONING_MODE: ${EUROGAS_NEXUS_OIDC_PROVISIONING_MODE:-preprovisioned}
  EUROGAS_NEXUS_OIDC_APPROVED_DOMAINS: ${EUROGAS_NEXUS_OIDC_APPROVED_DOMAINS:-}
  EUROGAS_NEXUS_OIDC_GROUPS_ROLE_MAP: ${EUROGAS_NEXUS_OIDC_GROUPS_ROLE_MAP:-}
  EUROGAS_NEXUS_OIDC_GROUPS_SCOPE_MAP: ${EUROGAS_NEXUS_OIDC_GROUPS_SCOPE_MAP:-}
  EUROGAS_NEXUS_OIDC_ALLOW_HTTP: ${EUROGAS_NEXUS_OIDC_ALLOW_HTTP:-0}
  EUROGAS_NEXUS_LOCAL_ACCOUNTS: ${EUROGAS_NEXUS_LOCAL_ACCOUNTS:-auto}
  EUROGAS_NEXUS_MFA_REQUIRED: ${EUROGAS_NEXUS_MFA_REQUIRED:-privileged}
  EUROGAS_NEXUS_SESSION_IDLE_MINUTES: ${EUROGAS_NEXUS_SESSION_IDLE_MINUTES:-30}
  EUROGAS_NEXUS_SESSION_ABSOLUTE_HOURS: ${EUROGAS_NEXUS_SESSION_ABSOLUTE_HOURS:-10}
  EUROGAS_NEXUS_DUAL_CONTROL_COOLING_DAYS: ${EUROGAS_NEXUS_DUAL_CONTROL_COOLING_DAYS:-7}
  EUROGAS_NEXUS_BREAK_GLASS: ${EUROGAS_NEXUS_BREAK_GLASS:-on}
  EUROGAS_NEXUS_CSP_EXTRA_HOSTS: ${EUROGAS_NEXUS_CSP_EXTRA_HOSTS:-}
  EUROGAS_NEXUS_CORS_ORIGINS: ${EUROGAS_NEXUS_CORS_ORIGINS:-}
  # API processes (read by uvicorn in the api service only). One by default; several
  # (compose.scale.yaml) need the shared cache: docs/operations/API_SERVING_AND_SHARED_CACHE.md.
  # The cache URL carries the Valkey password, so only the API (and its preflight) get it.
  UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
  EUROGAS_NEXUS_SHARED_CACHE_URL: ${EUROGAS_NEXUS_SHARED_CACHE_URL:-}
  EUROGAS_NEXUS_DB_STATEMENT_TIMEOUT_MS: ${EUROGAS_NEXUS_DB_STATEMENT_TIMEOUT_MS:-30000}
  # The gateway terminates TLS and proxies to api:8000. uvicorn trusts X-Forwarded-* only
  # from the gateway's fixed address on the runtime network (security review M8), not from
  # any container on any Docker network.
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.30.57.10}
  # Observability (docs/operations/MONITORING.md). GET /metrics answers only a scraper with
  # this token and/or from these networks; with neither set it does not exist.
  EUROGAS_NEXUS_METRICS_SCRAPE_TOKEN: ${EUROGAS_NEXUS_METRICS_SCRAPE_TOKEN:-}
  EUROGAS_NEXUS_METRICS_ALLOWED_NETWORKS: ${EUROGAS_NEXUS_METRICS_ALLOWED_NETWORKS:-}
  # Shared by the API's worker processes (an empty tmpfs mounted by the api service).
  PROMETHEUS_MULTIPROC_DIR: /run/eurogas-metrics
  EUROGAS_NEXUS_LOG_FORMAT: ${EUROGAS_NEXUS_LOG_FORMAT:-json}
  EUROGAS_NEXUS_OTEL_ENABLED: ${EUROGAS_NEXUS_OTEL_ENABLED:-0}

# One JSON log line per record (stderr); Docker rotates the files (5 x 20 MB per container).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Container hardening for every application container (security review M8): no privilege
# escalation, no Linux capabilities, a read-only root filesystem with a private /tmp.
x-hardening: &hardening
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=256m,mode=1777

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - runtime-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  config-check:
    <<: *hardening
    # Refuses to let the stack come up on a misconfigured environment. This runs
    # in the application image because the check reads the same contract the
    # service does; a missing credential key or a half-configured OIDC block would
    # otherwise surface only when a user first hits the affected feature.
    #
    # Errors block the stack; warnings do not. Warnings describe a deployment that
    # can serve correctly but that a release gate should still question (an
    # unrotatable credential key, an undeclared trusted proxy), so they are raised
    # by `--strict` in CI rather than by refusing to start here.
    image: ${EUROGAS_NEXUS_API_IMAGE}
    environment: *runtime-environment
    command: ["python", "scripts/ops/check_config.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *hardening
    # Never migrates in this (release) stack: it checks that the database is at the revision
    # this version needs and refuses to let the API start otherwise. Upgrading is the gated
    # operator step (backup check, lock and statement timeouts, audit), run as the schema
    # owner (docs/security/DATABASE_ROLES.md):
    #   docker compose run --rm migrate python scripts/ops/upgrade_database.py upgrade \
    #     --operator "<your name>"
    # docs/operations/DATABASE_UPGRADE.md
    image: ${EUROGAS_NEXUS_API_IMAGE}
    environment: *migrate-environment
    command: ["python", "scripts/ops/upgrade_database.py", "on-start"]
    depends_on:
      postgres:
        condition: service_healthy
      config-check:
        condition: service_completed_successfully
    restart: "no"

  reference-seed:
    # Loads the shipped NWE reference network bundle (ENTSOG points, schematic zone links)
    # into an empty store, so the map shows the network before ENTSOG is first read or on an
    # installation without outbound network. A store holding a live ENTSOG read is left as it
    # is. No network access; real reference metadata, not simulated data.
    <<: *hardening
    image: ${EUROGAS_NEXUS_API_IMAGE}
    environment: *db-environment
    command: ["python", "scripts/ops/seed_reference_network.py", "--json"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *hardening
    image: ${EUROGAS_NEXUS_API_IMAGE}
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      # The root filesystem is read-only; research artefacts go to their own volume.
      EUROGAS_NEXUS_RESEARCH_ARTIFACT_ROOT: /var/lib/eurogas-nexus/snapshots
    volumes:
      - runtime-artifacts:/var/lib/eurogas-nexus
    networks:
      default:
      runtime:
    logging: *default-logging
    # A private /tmp on the read-only root, and the metric files, empty at every start so
    # they never outlive the processes that wrote them.
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run/eurogas-metrics:mode=1777
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The readiness probe needs no credential (api/dependencies/exempt_paths.py), so no
      # token appears in the health command or in `docker inspect`.
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/api/health/ready'); assert json.load(urllib.request.urlopen(req, timeout=3))['status'] == 'ready'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  gateway:
    image: caddy:2-alpine
    profiles: ["server"]
    restart: unless-stopped
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    networks:
      runtime:
        ipv4_address: 172.30.57.10
    environment:
      SERVER_NAME: ${SERVER_NAME}
    ports:
      - "${HTTPS_BIND_ADDRESS}:${HTTPS_PORT}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/caddy/tls:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --no-check-certificate --header='Host: '$${SERVER_NAME} --spider https://127.0.0.1/api/health"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  public-ingestion:
    <<: *hardening
    image: ${EUROGAS_NEXUS_API_IMAGE}
    profiles: ["tools"]
    environment: *provider-environment
    command:
      - python
      - scripts/ops/ingest_public_sources.py
      - --source
      - ecb
      - --source
      - entsog
      - --source
      - entsog-capacity
      - --source
      - entsog-reference
      - --source
      - entsog-tariffs
      - --limit
      - "10000"
      # ENTSOG flows and capacity need a window (at most 30 gas days rolling) and the
      # complete-read page bounds; without them the read was refused or normalised nothing.
      - --entsog-lookback-gas-days
      - "7"
      - --entsog-page-size
      - "1000"
      - --entsog-max-pages
      - "50"
      - --json
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  public-ingestion-worker:
    # Every scheduled public source through the product's one scheduler path (the same
    # scripts/ops/run_dataops_scheduler.py the real store runs): ECB, ENTSOG (flows, capacity;
    # the reference network at most daily), GIE AGSI/ALSI, EIA Henry Hub, ENTSO-E power,
    # Elexon, National Gas supply and demand, SONIA/ESTR/SOFR, GIE IIP and ENTSOG REMIT
    # outages. Each source runs on its own schedule and read bounds, fails on its own and is
    # retried by the scheduler's policy. ENTSOG and GIE read only after an administrator
    # approved them; EIA, ENTSO-E and GIE read only with the firm's key (Admin -> Data
    # sources); a keyed source switches on once its key is stored.
    <<: *hardening
    image: ${EUROGAS_NEXUS_API_IMAGE}
    profiles: ["public-ingestion"]
    restart: unless-stopped
    logging: *default-logging
    environment: *provider-environment
    command:
      - python
      - scripts/ops/run_dataops_scheduler.py
      - --interval-seconds
      - "60"
      # A rolling week of ENTSOG flows and capacity each run (revisions arrive for days).
      - --entsog-lookback-gas-days
      - "7"
    depends_on:
      migrate:
        condition: service_completed_successfully

  market-events-worker:
    # The default trigger for targeted opportunity re-evaluation (M7): waits on PostgreSQL's
    # market_events notice (sent at the commit of a price, FX, outage, contract or mark change),
    # drains the outbox within about a second and runs the debounced full evaluation when one
    # is due. It also drains every 15 s, so a lost notice costs latency, never an event; the
    # scheduler's drain after each tick stays as the fallback sweep.
    <<: *hardening
    image: ${EUROGAS_NEXUS_API_IMAGE}
    profiles: ["public-ingestion"]
    restart: unless-stopped
    logging: *default-logging
    environment: *db-environment
    command:
      - python
      - scripts/ops/market_events.py
      - listen
      - --interval
      - "15"
    depends_on:
      migrate:
        condition: service_completed_successfully

  monitoring-worker:
    <<: *hardening
    image: ${EUROGAS_NEXUS_API_IMAGE}
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *default-logging
    environment: *provider-environment
    command:
      - python
      - scripts/ops/run_monitoring_worker.py
      - --interval-seconds
      - "10"
      - --max-llm-enrichments
      - "3"
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  runtime:
    name: eurogas-nexus-runtime
    ipam:
      config:
        - subnet: 172.30.57.0/24

volumes:
  runtime-postgres:
    name: eurogas-nexus-runtime-postgres
  runtime-artifacts:
    name: eurogas-nexus-runtime-artifacts
