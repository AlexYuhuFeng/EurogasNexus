# promtool unit tests for eurogas-nexus-alerts.yml:
#   promtool test rules deploy/monitoring/prometheus/eurogas-nexus-alerts.test.yml
# (tests/contract/test_alert_rules.py runs it when promtool or Docker is available.)

rule_files:
  - eurogas-nexus-alerts.yml

evaluation_interval: 30s

tests:
  # The phase-1 exit criterion: an alert fires on a stopped scheduler.
  - interval: 30s
    input_series:
      # Beating (age 0-30 s) for 5 minutes, then stopped: the age grows 30 s per sample.
      - series: 'eurogas_scheduler_heartbeat_age_seconds{scheduler="dataops",instance="api-1",job="eurogas-nexus-api"}'
        values: '10 20 10 20 10 20 10 20 10 20 30+30x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: EurogasSchedulerHeartbeatMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: EurogasSchedulerHeartbeatMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
            exp_annotations:
              summary: "Data-operations scheduler has not reported for over 5 minutes"
              description: "The last scheduler heartbeat is 10m 30s old. No source is read on its schedule while this lasts, so prices, flows and storage go stale."
              runbook_url: "docs/operations/ALERT_RESPONSES.md#eurogasschedulerheartbeatmissing"

  # A store no scheduler ever ran on (+Inf) alerts too.
  - interval: 30s
    input_series:
      - series: 'eurogas_scheduler_heartbeat_age_seconds{scheduler="dataops",instance="api-1",job="eurogas-nexus-api"}'
        values: '+Inf +Inf +Inf +Inf +Inf +Inf +Inf +Inf +Inf +Inf'
    alert_rule_test:
      - eval_time: 3m
        alertname: EurogasSchedulerHeartbeatMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
            exp_annotations:
              summary: "Data-operations scheduler has not reported for over 5 minutes"
              description: "The last scheduler heartbeat is +Inf old. No source is read on its schedule while this lasts, so prices, flows and storage go stale."
              runbook_url: "docs/operations/ALERT_RESPONSES.md#eurogasschedulerheartbeatmissing"

  # Stale beyond the source's own rule; scraped from two API servers, it fires once.
  - interval: 1m
    input_series:
      - series: 'eurogas_source_freshness_seconds{source_id="src-ecb",instance="api-1"}'
        values: '20000x20'
      - series: 'eurogas_source_freshness_seconds{source_id="src-ecb",instance="api-2"}'
        values: '20000x20'
      - series: 'eurogas_source_stale_after_seconds{source_id="src-ecb",instance="api-1"}'
        values: '14400x20'
      - series: 'eurogas_source_stale_after_seconds{source_id="src-ecb",instance="api-2"}'
        values: '14400x20'
      - series: 'eurogas_source_freshness_seconds{source_id="src-entsog",instance="api-1"}'
        values: '600x20'
      - series: 'eurogas_source_stale_after_seconds{source_id="src-entsog",instance="api-1"}'
        values: '14400x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: EurogasSourceStale
        exp_alerts:
          - exp_labels:
              severity: warning
              team: data
              source_id: src-ecb
            exp_annotations:
              summary: "Source src-ecb is older than its freshness rule"
              description: "src-ecb last succeeded 5h 33m 20s ago, beyond the stale threshold its definition sets. Screens built on it show stale data."
              runbook_url: "docs/operations/ALERT_RESPONSES.md#eurogassourcestale"

  # Pool: 19 of 20 connections in use for 6 minutes.
  - interval: 1m
    input_series:
      - series: 'eurogas_db_pool_checked_out{instance="api-1",job="eurogas-nexus-api"}'
        values: '19x10'
      - series: 'eurogas_db_pool_size{instance="api-1",job="eurogas-nexus-api"}'
        values: '10x10'
      - series: 'eurogas_db_pool_overflow{instance="api-1",job="eurogas-nexus-api"}'
        values: '10x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: EurogasDbPoolNearlyExhausted
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              instance: api-1
            exp_annotations:
              summary: "Database pool on api-1 is over 90 % in use"
              description: "95% of the API's database connections are checked out. When none is left, requests wait and then fail with 503."
              runbook_url: "docs/operations/ALERT_RESPONSES.md#eurogasdbpoolnearlyexhausted"

  # Pool exhaustion from the counters: timeouts on api-1, 20 % waits on api-2 (two worker
  # processes' series summed), and api-3 busy without waiting raises nothing.
  - interval: 1m
    input_series:
      - series: 'eurogas_db_pool_timeouts_total{instance="api-1",job="eurogas-nexus-api"}'
        values: '0 0 0 1+1x10'
      - series: 'eurogas_db_pool_checkouts_total{instance="api-1",job="eurogas-nexus-api"}'
        values: '0+100x12'
      - series: 'eurogas_db_pool_waits_total{instance="api-1",job="eurogas-nexus-api"}'
        values: '0x12'
      - series: 'eurogas_db_pool_timeouts_total{instance="api-2",job="eurogas-nexus-api"}'
        values: '0x12'
      - series: 'eurogas_db_pool_checkouts_total{instance="api-2",job="eurogas-nexus-api",pid="11"}'
        values: '0+50x12'
      - series: 'eurogas_db_pool_checkouts_total{instance="api-2",job="eurogas-nexus-api",pid="12"}'
        values: '0+50x12'
      - series: 'eurogas_db_pool_waits_total{instance="api-2",job="eurogas-nexus-api",pid="11"}'
        values: '0+20x12'
      - series: 'eurogas_db_pool_waits_total{instance="api-2",job="eurogas-nexus-api",pid="12"}'
        values: '0x12'
      - series: 'eurogas_db_pool_timeouts_total{instance="api-3",job="eurogas-nexus-api"}'
        values: '0x12'
      - series: 'eurogas_db_pool_checkouts_total{instance="api-3",job="eurogas-nexus-api"}'
        values: '0+500x12'
      - series: 'eurogas_db_pool_waits_total{instance="api-3",job="eurogas-nexus-api"}'
        values: '0+1x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: EurogasDbPoolExhausted
        exp_alerts: []
      - eval_time: 8m
        alertname: EurogasDbPoolExhausted
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              instance: api-1
            exp_annotations:
              summary: "API requests on api-1 wait for or fail to get a database connection"
              description: "The database pool ran out: requests either waited for a connection or gave up after the pool timeout and failed with 503."
              runbook_url: "docs/operations/ALERT_RESPONSES.md#eurogasdbpoolexhausted"
          - exp_labels:
              severity: critical
              team: platform
              instance: api-2
            exp_annotations:
              summary: "API requests on api-2 wait for or fail to get a database connection"
              description: "The database pool ran out: requests either waited for a connection or gave up after the pool timeout and failed with 503."
              runbook_url: "docs/operations/ALERT_RESPONSES.md#eurogasdbpoolexhausted"

  # Error rate: 10 % server errors; and a quiet API raises nothing.
  - interval: 1m
    input_series:
      - series: 'eurogas_http_requests_total{instance="api-1",route_group="/api/market",method="GET",status_class="2xx"}'
        values: '0+90x20'
      - series: 'eurogas_http_requests_total{instance="api-1",route_group="/api/market",method="GET",status_class="5xx"}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: EurogasApiErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              instance: api-1
            exp_annotations:
              summary: "More than 5 % of API requests on api-1 fail"
              description: "10% of requests returned a server error over the last 5 minutes."
              runbook_url: "docs/operations/ALERT_RESPONSES.md#eurogasapierrorrate"
      - eval_time: 18m
        alertname: EurogasJobFailures
        exp_alerts: []

  # The server clock: the warning is 1 from 5 minutes on; it fires only after 10 minutes of it.
  - interval: 1m
    input_series:
      - series: 'eurogas_clock_warning{instance="api-1",job="eurogas-nexus-api"}'
        values: '0x5 1+0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: EurogasServerClockWrong
        exp_alerts: []
      - eval_time: 16m
        alertname: EurogasServerClockWrong
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              instance: api-1
            exp_annotations:
              summary: "The server clock on api-1 is wrong or not synchronised"
              description: "Deals and prices are ordered by their timestamps, so this clock can place a deal before the price it traded on or in the wrong minute. The check warns when NTP synchronisation is off or the measured offset is above 0.5 s."
              runbook_url: "docs/operations/ALERT_RESPONSES.md#eurogasserverclockwrong"
