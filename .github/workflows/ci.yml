name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Markdown links
        run: python scripts/ci/check_markdown_links.py

      - name: Tests
        run: pytest -q tests

      - name: API load smoke (in-process, no server)
        run: python scripts/ops/load_smoke.py --requests 200 --concurrency 8 --p95-threshold-ms 1000

      - name: API load smoke (served instance over HTTP)
        run: bash scripts/ops/run_served_load_smoke.sh

      - name: MCP server handshake smoke
        run: echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | python -m eurogas_nexus.mcp.server | grep -q 'protocolVersion'

      - name: Import API
        run: python -c "from apps.api.main import app; print('app import ok'); print(len(app.openapi()['paths']))"

  dependency-audit:
    name: Dependency license & CVE audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.12"

      - name: Install package from hash-pinned locks
        run: |
          python -m pip install --require-hashes -r requirements-build.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: License policy audit (fail-closed)
        run: python scripts/ci/audit_dependencies.py "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"

      - name: CVE audit (pip-audit)
        run: python -m pip_audit

  integration-postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUNTIME_STORE_DATABASE_URL: postgresql+pg8000://nexus:nexus@127.0.0.1:5432/nexus_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: PostgreSQL migrations + DB-backed smoke tests
        run: bash scripts/ci/run_postgres_ci.sh

  web-client-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install Web dependencies
        working-directory: clients/web
        run: npm ci

      - name: Build Web client
        working-directory: clients/web
        run: npm run build

      - name: Test Web client
        working-directory: clients/web
        run: npm run test

      - name: Upload Web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eurogas-nexus-web
          path: clients/web/dist
          if-no-files-found: error

  browser-acceptance:
    name: Browser acceptance (EN/ZH, 3 viewports)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_uat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUNTIME_STORE_DATABASE_URL: postgresql+pg8000://nexus:nexus@127.0.0.1:5432/nexus_uat
      EUROGAS_NEXUS_ENV: test
      EUROGAS_NEXUS_API_PROFILE: development
      EUROGAS_NEXUS_UAT_FIXTURE_ALLOWED: "1"
      EUROGAS_NEXUS_DEV_LOGIN_USERNAME: eurogas-uat-admin
      EUROGAS_NEXUS_DEV_LOGIN_PASSWORD: uat-password
      EUROGAS_NEXUS_CORS_ORIGINS: http://127.0.0.1:3000
      EUROGAS_NEXUS_LLM_EXTERNAL_PROVIDER_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.12"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install application dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Web dependencies
        working-directory: clients/web
        run: npm ci

      - name: Install pinned browser acceptance tools
        run: |
          mkdir -p /tmp/eurogas-uat
          npm install --prefix /tmp/eurogas-uat --no-package-lock --no-save playwright@1.55.0 axe-core@4.10.3
          node /tmp/eurogas-uat/node_modules/playwright/cli.js install --with-deps chromium

      - name: Migrate and seed deterministic UAT runtime
        run: |
          alembic upgrade head
          python scripts/ops/seed_preview_runtime_data.py
          python scripts/uat/seed_uat_fixture.py
          python scripts/uat/seed_browser_identity.py

      - name: Start API and Web servers
        run: |
          mkdir -p artifacts/uat-browser
          python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 > artifacts/uat-browser/api.log 2>&1 &
          echo $! > /tmp/eurogas-api.pid
          npm --prefix clients/web run dev -- --host 127.0.0.1 > artifacts/uat-browser/vite.log 2>&1 &
          echo $! > /tmp/eurogas-vite.pid

          api_ready=0
          for _ in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health >/dev/null; then
              api_ready=1
              break
            fi
            sleep 1
          done
          if test "$api_ready" != "1"; then
            # This step has failed three times on unchanged code by not starting the API inside the
            # readiness window, and each time the job proved only *that* it failed: the process
            # output went to a file nobody printed. Print it, so the next occurrence is a diagnosis
            # rather than another re-run.
            echo "::error::the API did not answer /api/health within 60s - api.log follows"
            tail -n 200 artifacts/uat-browser/api.log || true
            exit 1
          fi

          web_ready=0
          for _ in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000 >/dev/null; then
              web_ready=1
              break
            fi
            sleep 1
          done
          if test "$web_ready" != "1"; then
            echo "::error::the Web dev server did not answer on :3000 within 60s - vite.log follows"
            tail -n 200 artifacts/uat-browser/vite.log || true
            exit 1
          fi

      - name: Run whole-product browser acceptance
        env:
          EUROGAS_UAT_PLAYWRIGHT_PATH: /tmp/eurogas-uat/node_modules/playwright/index.js
          EUROGAS_UAT_AXE_PATH: /tmp/eurogas-uat/node_modules/axe-core/axe.min.js
          EUROGAS_UAT_OUTPUT_DIR: artifacts/uat-browser
        run: |
          set +e
          node scripts/uat/browser_workflow_smoke.mjs
          sweep_status=$?
          set -e
          if test "$sweep_status" != "0"; then
            # The sweep writes its own summary; print it so a failure is readable in the job log
            # rather than only inside the uploaded artifact.
            cat artifacts/uat-browser/summary.json 2>/dev/null || true
          fi
          exit "$sweep_status"

      - name: Stop UAT servers
        if: always()
        run: |
          if test -f /tmp/eurogas-vite.pid; then kill "$(cat /tmp/eurogas-vite.pid)" || true; fi
          if test -f /tmp/eurogas-api.pid; then kill "$(cat /tmp/eurogas-api.pid)" || true; fi

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eurogas-nexus-browser-acceptance
          path: artifacts/uat-browser
          if-no-files-found: warn
          retention-days: 7

  desktop-client-build:
    name: Build desktop client (${{ matrix.artifact_label }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact_label: windows-x64
            artifact_glob: clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            bundle: deb
            artifact_label: linux-x64
            artifact_glob: clients/desktop/src-tauri/target/release/bundle/deb/*.deb
          - os: ubuntu-24.04-arm
            bundle: deb
            artifact_label: linux-arm64
            artifact_glob: clients/desktop/src-tauri/target/release/bundle/deb/*.deb

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install_linux_tauri_dependencies.sh

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: |
            clients/web/package-lock.json
            clients/desktop/package-lock.json

      - name: Set up Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1

      - name: Enforce Cargo.lock
        working-directory: clients/desktop
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Install Web dependencies
        working-directory: clients/web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: clients/desktop
        run: npm ci

      - name: Build desktop bundle
        working-directory: clients/desktop
        run: npm run build -- --bundles ${{ matrix.bundle }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eurogas-nexus-${{ matrix.artifact_label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
