name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Declared once. `.python-version`, `.nvmrc` and `rust-toolchain.toml` are the
  # canonical files a developer toolchain reads; these mirror them for the runner,
  # and `scripts/ci/check_toolchain_versions.py` fails the build when any of the
  # five places disagree. Six hard-coded copies of the Python version used to sit
  # throughout this file, so bumping a toolchain meant finding them all.
  PYTHON_VERSION: "3.11.12"
  NODE_VERSION: "24.13.1"
  RUST_TOOLCHAIN: "1.94.0"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package from hash-pinned locks
        # This job produces the G1 evidence the release gate trusts, so its
        # dependencies must be the locked ones. Installing the `.[dev]` extra
        # resolved versions from the index at run time, which meant the build whose
        # green result authorises publication was not reproducible and could drift.
        run: |
          python -m pip install --require-hashes -r requirements-build.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Ruff
        run: ruff check .

      - name: Markdown links
        run: python scripts/ci/check_markdown_links.py

      - name: Configuration contract
        # Every environment variable the code reads must be declared in
        # src/eurogas_nexus/core/config_contract.py, every declaration must have a
        # read site, and no shipped template may set an undeclared variable. This is
        # what keeps .env.example from drifting away from the code, which is how the
        # runtime DB URL, the credential key and the whole OIDC block came to be
        # undocumented, and how a flag nothing reads came to be documented as a control.
        run: python scripts/ci/check_config_contract.py

      - name: Environment templates are current
        run: python scripts/ci/generate_env_template.py --check

      - name: Toolchain versions agree
        # .python-version / .nvmrc / rust-toolchain.toml are canonical; pyproject,
        # both client engines fields, the workflow env blocks and the lock headers
        # must all match them. A partial bump leaves a developer or a runner on an
        # interpreter the lock file was not compiled for.
        run: python scripts/ci/check_toolchain_versions.py

      - name: Configuration preflight (release-shaped environment)
        # A complete release environment must pass with no findings at all. This is
        # the gate that fails here rather than on a customer's first start-up when a
        # contract change would break a valid production configuration. It runs in
        # the same image the deployment uses, so it also proves the shipped check
        # script is present and runnable in the operator's runtime.
        run: python scripts/ops/check_config.py --env-file scripts/ci/fixtures/release.env --strict

      - name: Tests
        run: pytest -q tests

      - name: API load smoke (in-process, no server)
        # Owner decision D1: every profile identifies its callers, so the smoke presents the
        # deployment token - the documented SDK/CLI credential - and refuses to run without one
        # rather than reporting a table of 401 latencies as a baseline. The variable is scoped to
        # this step and the next one on purpose: set job-wide it would override the token the test
        # suite configures for itself, and every suite that presents it would measure a 403.
        env:
          EUROGAS_NEXUS_PUBLIC_API_TOKEN: ci-load-smoke-public-api-token
        run: python scripts/ops/load_smoke.py --requests 200 --concurrency 8 --p95-threshold-ms 1000

      - name: API load smoke (served instance over HTTP)
        env:
          EUROGAS_NEXUS_PUBLIC_API_TOKEN: ci-load-smoke-public-api-token
        run: bash scripts/ops/run_served_load_smoke.sh

      - name: MCP server handshake smoke
        run: echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | python -m eurogas_nexus.mcp.server | grep -q 'protocolVersion'

      - name: Import API
        run: python -c "from apps.api.main import app; print('app import ok'); print(len(app.openapi()['paths']))"

  dependency-audit:
    name: Dependency license & CVE audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package from hash-pinned locks
        run: |
          python -m pip install --require-hashes -r requirements-build.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: License policy audit (fail-closed)
        run: python scripts/ci/audit_dependencies.py "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"

      - name: Node license policy audit (both client locks, fail-closed)
        # Audits exactly the checked-in lock files through the shared structured
        # lock inventory reader; dev/optional entries included, so this is
        # conservative lock coverage rather than shipped-artifact proof.
        run: python scripts/ci/audit_dependencies.py --npm-lock clients/web/package-lock.json --npm-lock clients/desktop/package-lock.json

      - name: CVE audit (pip-audit, installed environment)
        # Audits what is actually installed in this job. Kept because it also sees
        # transitive packages the locks do not name, but on its own it only proves
        # the CI environment is clean - not that the set a customer receives is.
        run: python -m pip_audit

      - name: CVE audit (pip-audit, shipped and internal science lock sets)
        # Audits the declared dependency set rather than this environment, so the
        # result is a statement about what ships: the runtime lock is the image's
        # dependency set, and the full lock covers the development extras.
        # The internal science lock is included so the reviewed NumPy pin has a
        # CVE check too; this is not a shipped-runtime audit or licence approval.
        run: |
          python -m pip_audit -r requirements-runtime.lock
          python -m pip_audit -r requirements.lock
          python -m pip_audit -r requirements-scientific-ci.lock

      - name: Set up Rust for locked metadata audit
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust license policy audit (desktop crate graph, fail-closed)
        run: python scripts/ci/audit_dependencies.py --cargo-lock clients/desktop/src-tauri/Cargo.lock

  python-license-texts:
    name: Python license text evidence (runtime lock)
    # Runs in the ordinary main-branch CI run and uploads review evidence without
    # adding a requirement to the release acceptance gate (ci_acceptance in
    # scripts/release/policy/stable_gate_policy.json): the artifact is review
    # evidence, not legal approval or a customer package certification. Promoting
    # it into that gate is a deliberate release-policy edit (add the job name to
    # required_jobs and drop this condition), never an automatic consequence.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the runtime lock into an isolated venv
        # Only requirements-runtime.lock is installed, hash-checked, into a throwaway
        # venv: the collected texts must come from exactly those locked distributions,
        # never from the runner's or a developer's environment.
        run: |
          python -m venv "$RUNNER_TEMP/python-license-venv"
          "$RUNNER_TEMP/python-license-venv/bin/python" -m pip install --require-hashes -r requirements-runtime.lock

      - name: Collect license/notice texts from the locked venv
        # The collector exits non-zero when any locked package yields no usable text
        # evidence. That is a finding and must fail this job rather than be masked;
        # the manifest and any partial texts are still written for review.
        run: |
          venv_purelib="$("$RUNNER_TEMP/python-license-venv/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          python scripts/release/collect_python_license_texts.py \
            --site-packages "$venv_purelib" \
            --output-dir artifacts/python-license-texts \
            --runtime-lock requirements-runtime.lock

      - name: Upload Python license text evidence
        # Runs even when collection failed so the incomplete manifest and partial
        # texts remain available; a missing report is an upload error. The artifact
        # is review evidence, not legal approval and not a customer package
        # certification, and release publishing does not consume it.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eurogas-nexus-python-license-texts
          path: artifacts/python-license-texts
          if-no-files-found: error
          retention-days: 7

  integration-postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUNTIME_STORE_DATABASE_URL: postgresql+pg8000://nexus:nexus@127.0.0.1:5432/nexus_test
      # Owner decision D1: every profile identifies its callers, so the DB-backed API smoke in
      # scripts/ci/run_postgres_ci.sh presents the deployment token. Without one it would measure a
      # fail-closed 503 instead of the read it exists to check.
      EUROGAS_NEXUS_PUBLIC_API_TOKEN: ci-integration-public-api-token

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package from hash-pinned locks
        run: |
          python -m pip install --require-hashes -r requirements-build.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: PostgreSQL migrations + DB-backed smoke tests
        run: bash scripts/ci/run_postgres_ci.sh

  web-client-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install Web dependencies
        working-directory: clients/web
        run: npm ci

      - name: Build Web client
        working-directory: clients/web
        run: npm run build

      - name: Test Web client
        working-directory: clients/web
        run: npm run test

      - name: Upload Web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eurogas-nexus-web
          path: clients/web/dist
          if-no-files-found: error

  browser-acceptance:
    name: Browser acceptance (EN/ZH, 3 viewports)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_uat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUNTIME_STORE_DATABASE_URL: postgresql+pg8000://nexus:nexus@127.0.0.1:5432/nexus_uat
      EUROGAS_NEXUS_ENV: test
      EUROGAS_NEXUS_API_PROFILE: development
      EUROGAS_NEXUS_UAT_FIXTURE_ALLOWED: "1"
      EUROGAS_NEXUS_DEV_LOGIN_USERNAME: eurogas-uat-admin
      EUROGAS_NEXUS_DEV_LOGIN_PASSWORD: uat-password
      EUROGAS_NEXUS_CORS_ORIGINS: http://127.0.0.1:3000
      EUROGAS_NEXUS_LLM_EXTERNAL_PROVIDER_ENABLED: "false"
      # Owner decision D1: every profile identifies its callers. The browser authenticates through
      # the exempt development login, but the shell asks GET /api/me before it has a session, and a
      # deployment with no token configured fails that closed with 503. Declaring the deployment
      # token here makes the acceptance environment a configured one, which is what it is.
      EUROGAS_NEXUS_PUBLIC_API_TOKEN: acceptance-public-api-token

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install application dependencies from hash-pinned locks
        run: |
          python -m pip install --require-hashes -r requirements-build.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Install Web dependencies
        working-directory: clients/web
        run: npm ci

      - name: Install pinned browser acceptance tools
        # Installed from a committed lock file with integrity hashes rather than
        # `npm install playwright@1.55.0`, which resolved the dependency tree from
        # the registry at run time and verified no hash. This job's result is the
        # G1 evidence the release gate consumes, so the tools that produce it are
        # supply-chain surface too. The store is cached so a frozen install stays
        # cheap.
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --dir scripts/ci/browser-acceptance install --frozen-lockfile
          node scripts/ci/browser-acceptance/node_modules/playwright/cli.js install --with-deps chromium

      - name: Migrate and seed deterministic UAT runtime
        run: |
          alembic upgrade head
          python scripts/ops/seed_preview_runtime_data.py
          python scripts/uat/seed_uat_fixture.py
          python scripts/uat/seed_browser_identity.py

      - name: Start API and Web servers
        run: |
          mkdir -p artifacts/uat-browser
          python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 > artifacts/uat-browser/api.log 2>&1 &
          echo $! > /tmp/eurogas-api.pid
          npm --prefix clients/web run dev -- --host 127.0.0.1 > artifacts/uat-browser/vite.log 2>&1 &
          echo $! > /tmp/eurogas-vite.pid

          api_ready=0
          for _ in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health >/dev/null; then
              api_ready=1
              break
            fi
            sleep 1
          done
          if test "$api_ready" != "1"; then
            # This step has failed three times on unchanged code by not starting the API inside the
            # readiness window, and each time the job proved only *that* it failed: the process
            # output went to a file nobody printed. Print it, so the next occurrence is a diagnosis
            # rather than another re-run.
            echo "::error::the API did not answer /api/health within 60s - api.log follows"
            tail -n 200 artifacts/uat-browser/api.log || true
            exit 1
          fi

          web_ready=0
          for _ in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000 >/dev/null; then
              web_ready=1
              break
            fi
            sleep 1
          done
          if test "$web_ready" != "1"; then
            echo "::error::the Web dev server did not answer on :3000 within 60s - vite.log follows"
            tail -n 200 artifacts/uat-browser/vite.log || true
            exit 1
          fi

      - name: Run whole-product browser acceptance
        env:
          EUROGAS_UAT_PLAYWRIGHT_PATH: scripts/ci/browser-acceptance/node_modules/playwright/index.js
          EUROGAS_UAT_AXE_PATH: scripts/ci/browser-acceptance/node_modules/axe-core/axe.min.js
          EUROGAS_UAT_OUTPUT_DIR: artifacts/uat-browser
        run: |
          set +e
          node scripts/uat/browser_workflow_smoke.mjs
          sweep_status=$?
          set -e
          if test "$sweep_status" != "0"; then
            # The sweep writes its own summary; print it so a failure is readable in the job log
            # rather than only inside the uploaded artifact.
            cat artifacts/uat-browser/summary.json 2>/dev/null || true
          fi
          exit "$sweep_status"

      - name: Stop UAT servers
        if: always()
        run: |
          if test -f /tmp/eurogas-vite.pid; then kill "$(cat /tmp/eurogas-vite.pid)" || true; fi
          if test -f /tmp/eurogas-api.pid; then kill "$(cat /tmp/eurogas-api.pid)" || true; fi

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eurogas-nexus-browser-acceptance
          path: artifacts/uat-browser
          if-no-files-found: warn
          retention-days: 7

  desktop-client-build:
    # Single native pipeline. The reusable workflow owns the pinned three-platform
    # matrix, the canonical Python fallback and hash-bound evidence; this caller
    # deliberately has no matrix, env, secrets or build steps of its own. The job ID
    # is retained for external references. Display-name changes are documented in
    # docs/release/acceptance/26_NATIVE_BUILD_ACCEPTANCE.md and are not release-gate
    # changes (desktop packaging is not a stable_gate_policy required job).
    name: Native desktop build (Windows x64, Linux x64/ARM64)
    uses: ./.github/workflows/native-acceptance.yml

  sdk-installed:
    name: SDK installed-wheel acceptance
    uses: ./.github/workflows/sdk-acceptance.yml

  weather-model-numerical:
    # One shared definition for ordinary CI and manual CI. No inputs, refs,
    # secrets, or write permission are passed from this caller.
    name: Weather model numerical acceptance (internal, NumPy 2.3.5)
    uses: ./.github/workflows/weather-model-acceptance.yml
