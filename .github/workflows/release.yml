name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: Preview or RC channel. Stable promotion is tag-only.
        type: choice
        required: true
        default: preview
        options:
          - preview
          - rc
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+.[0-9a-f]{7,40}'

permissions:
  contents: read

concurrency:
  group: eurogas-nexus-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.13.1"
  PYTHON_VERSION: "3.11.12"
  RUST_TOOLCHAIN: "1.94.0"

jobs:
  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.read.outputs.channel }}
      release_version: ${{ steps.read.outputs.release_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve release identity
        run: python scripts/release/resolve_release_context.py --output release-context.json

      - name: Export release metadata outputs
        id: read
        shell: bash
        run: |
          echo "channel=$(python -c "import json; print(json.load(open('release-context.json'))['channel'])")" >> "${GITHUB_OUTPUT}"
          echo "release_version=$(python -c "import json; print(json.load(open('release-context.json'))['release_version'])")" >> "${GITHUB_OUTPUT}"

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-context
          path: release-context.json
          if-no-files-found: error

  validate:
    name: Validate release candidate
    runs-on: ubuntu-24.04
    needs: resolve
    # actions: read exists only for the read-only same-SHA CI verification
    # (PILOT-B2) step below; publish-stable carries it for the strict gate's
    # re-derivation of the same claim - no other job reads the Actions API.
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python package from hash-pinned locks
        run: |
          python -m pip install --require-hashes -r requirements-build.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Version consistency gate
        run: python scripts/release/check_version_consistency.py

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q tests

      - name: Record Python test evidence
        shell: bash
        run: |
          ENVIRONMENT="github-actions/$(printf '%s/%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          mkdir -p release-assets/release-evidence
          python scripts/release/write_gate_evidence.py \
            --gate-id G2 --status PASS \
            --detail "full Python suite passed in the release validate job" \
            --commit-sha "$GITHUB_SHA" \
            --workflow release.yml --job validate \
            --environment "$ENVIRONMENT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output release-assets/release-evidence/python-tests.json

      - name: Record same-SHA CI acceptance evidence (read-only GitHub API)
        # Records what the Actions API reports for this exact commit's ci.yml
        # run: PASS only when that run is completed/successful and every
        # required job (including browser acceptance) succeeded. A missing,
        # pending or failed run is recorded as FAIL/PENDING_EXTERNAL and the
        # stable gate stays blocked; nothing is fabricated and no write API
        # (dispatch/release/tag/deploy) is called.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ENVIRONMENT="github-actions/$(printf '%s/%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          python scripts/release/write_ci_run_evidence.py \
            --commit-sha "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml --job validate \
            --environment "$ENVIRONMENT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output release-assets/release-evidence/ci-run.json

      - name: Record security test evidence
        # The G8 envelope may only come from an executed pytest security suite:
        # run_security_evidence.py launches tests/security itself in an
        # owner-only scratch workspace, derives the status from the JUnit
        # report plus its structured selection evidence (any deselection or
        # cases removed by collection hooks fail the run), refuses a non-empty
        # PYTEST_ADDOPTS/PYTEST_PLUGINS, pins -o addopts= so repository config
        # cannot filter the suite, binds --commit-sha to the checked-out git
        # HEAD before and after the run and refuses a dirty tracked worktree.
        # It fails the job on a non-zero exit, an empty suite,
        # failures/errors/skips, a malformed or count-inconsistent report, a
        # timeout, or any other tool error. There is no --status input, no way
        # to pass in a pre-existing report and no local-dry-run flag here; the
        # retained security-tests.junit.xml companion travels in the same
        # evidence directory and its hash is recorded in the envelope.
        shell: bash
        run: |
          ENVIRONMENT="github-actions/$(printf '%s/%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          python scripts/release/run_security_evidence.py \
            --commit-sha "$GITHUB_SHA" \
            --workflow release.yml --job validate \
            --environment "$ENVIRONMENT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output release-assets/release-evidence/security-tests.json

      - name: Upload validate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validate-evidence
          path: release-assets/release-evidence
          if-no-files-found: error

      - name: Import API
        run: python -c "from apps.api.main import app; print('app import ok'); print(len(app.openapi()['paths']))"

  reliability:
    name: Reliability and PostgreSQL evidence
    runs-on: ubuntu-24.04
    needs: validate

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUNTIME_STORE_DATABASE_URL: postgresql+pg8000://nexus:nexus@127.0.0.1:5432/nexus_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python package from hash-pinned locks
        run: |
          python -m pip install --require-hashes -r requirements-build.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: PostgreSQL migrations and DB smoke
        run: bash scripts/ci/run_postgres_ci.sh

      - name: Representative API performance baseline
        run: python scripts/ops/performance_baseline.py --requests 200 --concurrency 10 --json

      - name: In-process load smoke
        run: python scripts/ops/load_smoke.py --requests 200 --concurrency 8 --p95-threshold-ms 1000

      - name: Record PostgreSQL/performance evidence
        shell: bash
        run: |
          ENVIRONMENT="github-actions/$(printf '%s/%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          mkdir -p release-evidence
          python scripts/release/write_gate_evidence.py \
            --gate-id G3 --status PASS \
            --detail "PostgreSQL 16 migrations and DB-backed smoke passed" \
            --commit-sha "$GITHUB_SHA" \
            --workflow release.yml --job reliability \
            --environment "$ENVIRONMENT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output release-evidence/postgres-migration.json
          python scripts/release/write_gate_evidence.py \
            --gate-id G14 --status PASS \
            --detail "performance baseline and CI load smoke passed" \
            --commit-sha "$GITHUB_SHA" \
            --workflow release.yml --job reliability \
            --environment "$ENVIRONMENT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output release-evidence/performance.json

      - name: Upload reliability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reliability-evidence
          path: release-evidence
          if-no-files-found: error

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    needs: resolve

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            clients/web/package-lock.json
            clients/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1

      - name: Install pip-audit from hash-pinned lock
        run: python -m pip install --require-hashes -r requirements-build.lock

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-context
          path: release-context

      - name: Run Python/Node vulnerability scan
        run: |
          CHANNEL=$(python -c "import json; print(json.load(open('release-context/release-context.json'))['channel'])")
          python scripts/release/scan_vulnerabilities.py --channel "$CHANNEL" --output release-evidence/vulnerability-scan.json

      - name: Wrap scan evidence in a bound envelope
        shell: bash
        run: |
          ENVIRONMENT="github-actions/$(printf '%s/%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          STATUS=$(python -c "import json; print(json.load(open('release-evidence/vulnerability-scan.json'))['status'])")
          python scripts/release/write_gate_evidence.py \
            --gate-id G9 --status "$STATUS" \
            --detail "pip/npm/cargo runtime scans; container scan remains a release-CI digest step" \
            --commit-sha "$GITHUB_SHA" \
            --workflow release.yml --job dependency-scan \
            --environment "$ENVIRONMENT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --report release-evidence/vulnerability-scan.json \
            --output release-evidence/vulnerability-scan.json

      - name: Run Rust vulnerability scan
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: clients/desktop/src-tauri

      - name: Upload scan evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-scan-evidence
          path: release-evidence
          if-no-files-found: error

  web:
    name: Build Web client
    runs-on: ubuntu-24.04
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-context
          path: release-context

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          CONTEXT=release-context/release-context.json
          echo "channel=$(python -c "import json; print(json.load(open('$CONTEXT'))['channel'])")" >> "${GITHUB_OUTPUT}"
          echo "git_sha=$(python -c "import json; print(json.load(open('$CONTEXT'))['git_sha'])")" >> "${GITHUB_OUTPUT}"
          echo "git_ref=$(python -c "import json; print(json.load(open('$CONTEXT'))['git_ref'])")" >> "${GITHUB_OUTPUT}"
          echo "run_id=$(python -c "import json; print(json.load(open('$CONTEXT'))['build_run_id'])")" >> "${GITHUB_OUTPUT}"

      - name: Install Web dependencies
        working-directory: clients/web
        run: npm ci

      - name: Test Web client before packaging
        working-directory: clients/web
        run: npm test

      - name: Check bilingual UI key coverage
        run: python scripts/uat/check_i18n_parity.py

      - name: Build Web client with release identity
        working-directory: clients/web
        env:
          VITE_EUROGAS_RELEASE_CHANNEL: ${{ steps.meta.outputs.channel }}
          VITE_EUROGAS_BUILD_GIT_SHA: ${{ steps.meta.outputs.git_sha }}
          VITE_EUROGAS_BUILD_GIT_REF: ${{ steps.meta.outputs.git_ref }}
          VITE_EUROGAS_BUILD_RUN_ID: ${{ steps.meta.outputs.run_id }}
        run: npm run build

      - name: Package Web client
        shell: bash
        run: |
          RELEASE_VERSION=$(python -c "import json; print(json.load(open('release-context/release-context.json'))['release_version'].lstrip('v'))")
          mkdir -p release-assets
          tar -czf "release-assets/eurogas-nexus-web-${RELEASE_VERSION}.tar.gz" -C clients/web/dist .

      - name: Record Web build evidence
        shell: bash
        run: |
          ENVIRONMENT="github-actions/$(printf '%s/%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          mkdir -p release-assets/release-evidence
          python scripts/release/write_gate_evidence.py \
            --gate-id G4 --status PASS \
            --detail "frontend tests, bilingual key coverage and production build ran at this commit before packaging" \
            --commit-sha "$GITHUB_SHA" \
            --workflow release.yml --job web \
            --environment "$ENVIRONMENT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output release-assets/release-evidence/web-build.json

      - name: Upload Web release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web
          path: release-assets/*
          if-no-files-found: error

  desktop:
    name: Build desktop client (${{ matrix.artifact_label }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 NSIS package
          - os: windows-2025
            bundle: nsis
            artifact_label: windows-x64
            artifact_glob: clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
          # Linux x64 DEB package
          - os: ubuntu-24.04
            bundle: deb
            artifact_label: linux-x64
            artifact_glob: clients/desktop/src-tauri/target/release/bundle/deb/*.deb
          # Linux ARM64 DEB package
          - os: ubuntu-24.04-arm
            bundle: deb
            artifact_label: linux-arm64
            artifact_glob: clients/desktop/src-tauri/target/release/bundle/deb/*.deb

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-context
          path: release-context

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install_linux_tauri_dependencies.sh

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            clients/web/package-lock.json
            clients/desktop/package-lock.json

      - name: Set up Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1

      - name: Install Web dependencies
        working-directory: clients/web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: clients/desktop
        run: npm ci

      - name: Enforce Cargo.lock
        working-directory: clients/desktop
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build desktop bundle
        working-directory: clients/desktop
        run: npm run build -- --bundles ${{ matrix.bundle }}

      - name: Collect and rename desktop asset
        shell: bash
        run: |
          RELEASE_VERSION=$(python -c "import json; print(json.load(open('release-context/release-context.json'))['release_version'].lstrip('v'))")
          mkdir -p release-assets
          case "${{ matrix.artifact_label }}" in
            windows-x64)
              cp ${{ matrix.artifact_glob }} "release-assets/Eurogas-Nexus-Client-${RELEASE_VERSION}-windows-x64-setup.exe" ;;
            linux-x64)
              cp ${{ matrix.artifact_glob }} "release-assets/Eurogas-Nexus-Client-${RELEASE_VERSION}-linux-x64.deb" ;;
            linux-arm64)
              cp ${{ matrix.artifact_glob }} "release-assets/Eurogas-Nexus-Client-${RELEASE_VERSION}-linux-arm64.deb" ;;
          esac

      - name: Upload desktop release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-desktop-${{ matrix.artifact_label }}
          path: release-assets/*
          if-no-files-found: error

  runtime-image:
    name: Build and publish runtime image
    runs-on: ubuntu-24.04
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image name and candidate tag
        id: image
        shell: bash
        run: |
          NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eurogasnexus-api
          # Run-attempt-unique staging tag. It is never the customer-facing
          # channel tag and never an approval; the channel tag is written only
          # by the gate-first promote jobs, after a successful publish, by
          # copying the tested digest (no rebuild). A sha-<commit> alias is
          # deliberately not written: a rebuild of the same source need not
          # have the same digest, so the alias would be ambiguous.
          CANDIDATE_TAG="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$NAME" >> "${GITHUB_OUTPUT}"
          echo "candidate_tag=$CANDIDATE_TAG" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish candidate API image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/runtime/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.candidate_tag }}

      - name: Record image digest metadata
        shell: bash
        run: |
          mkdir -p image-metadata
          cat > image-metadata/image-metadata.json <<EOF
          {"image": "${{ steps.image.outputs.name }}", "digest": "${{ steps.build.outputs.digest }}"}
          EOF

      - name: Upload image metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-metadata
          path: image-metadata
          if-no-files-found: error

  deployment:
    name: Package deployment roles
    runs-on: ubuntu-24.04
    needs: [resolve, runtime-image]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-context
          path: release-context

      - name: Download immutable image identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-metadata
          path: image-metadata

      - name: Package and rename Server operator bundle
        shell: bash
        run: |
          RELEASE_VERSION=$(python -c "import json; print(json.load(open('release-context/release-context.json'))['release_version'].lstrip('v'))")
          IMAGE_DIGEST=$(python -c "import json,re; d=json.load(open('image-metadata/image-metadata.json'))['digest']; assert re.fullmatch(r'sha256:[0-9a-f]{64}', d), 'invalid image digest'; print(d)")
          bash scripts/release/package_deployment_bundle.sh release-assets \
            --release-context release-context/release-context.json \
            --image-digest "$IMAGE_DIGEST"
          mv release-assets/Eurogas-Nexus-Server-Windows.zip \
             "release-assets/Eurogas-Nexus-Server-${RELEASE_VERSION}-Windows.zip"

      - name: Upload deployment release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-deployment
          path: release-assets/*
          if-no-files-found: error

  sign-windows:
    name: Sign Windows artifacts (policy-aware)
    runs-on: windows-2025
    needs: desktop
    if: ${{ needs.desktop.result == 'success' }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download Windows desktop artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-desktop-windows-x64
          path: release-assets

      - name: Sign or record unsigned_pending_external
        shell: bash
        env:
          EUROGAS_NEXUS_WINDOWS_CODE_SIGNING_ENABLED: ${{ vars.WINDOWS_CODE_SIGNING_ENABLED == 'true' && 'true' || 'false' }}
          WINDOWS_SIGNING_CERT_PATH: ${{ secrets.WINDOWS_SIGNING_CERT_PATH }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          EUROGAS_NEXUS_SIGNTOOL_PATH: ${{ vars.WINDOWS_SIGNTOOL_PATH }}
        run: |
          python scripts/release/sign_release_artifacts.py \
            --artifacts-dir release-assets \
            --output signing-state-windows.json

      - name: Upload signed Windows asset and state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-desktop-windows-signed
          path: |
            release-assets/*
            signing-state-windows.json
          if-no-files-found: error

  sign-linux:
    name: Sign Linux artifacts (policy-aware)
    runs-on: ubuntu-24.04
    needs: desktop
    if: ${{ needs.desktop.result == 'success' }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download Linux desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-desktop-linux-*
          path: release-assets
          merge-multiple: true

      - name: Sign or record Linux baseline
        shell: bash
        env:
          EUROGAS_NEXUS_GPG_SIGNING_ENABLED: ${{ vars.GPG_SIGNING_ENABLED == 'true' && 'true' || 'false' }}
          EUROGAS_NEXUS_GPG_SIGNING_KEY_ID: ${{ secrets.GPG_SIGNING_KEY_ID }}
        run: |
          python scripts/release/sign_release_artifacts.py \
            --artifacts-dir release-assets \
            --output signing-state-linux.json

      - name: Upload signed Linux assets and state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-desktop-linux-signed
          path: |
            release-assets/*
            signing-state-linux.json
          if-no-files-found: error

  assemble:
    name: Assemble manifest, SBOM and checksums
    runs-on: ubuntu-24.04
    needs:
      - web
      - sign-windows
      - sign-linux
      - runtime-image
      - deployment
      - reliability
      - dependency-scan
      - container-acceptance
    if: ${{ always() && needs.web.result == 'success' && needs.sign-windows.result == 'success' && needs.sign-linux.result == 'success' && needs.runtime-image.result == 'success' && needs.deployment.result == 'success' && needs.reliability.result == 'success' && needs.dependency-scan.result == 'success' && needs.container-acceptance.result == 'success' }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Download immutable image identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-metadata
          path: release-assets/image-metadata

      - name: Merge signing state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          merged = {}
          for path in sorted(Path("release-assets").glob("signing-state-*.json")):
              merged.update(json.loads(path.read_text(encoding="utf-8")))
              path.unlink()
          Path("release-assets/signing-state.json").write_text(json.dumps(merged, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Generate SPDX SBOMs and notices
        shell: bash
        run: |
          python scripts/release/generate_sboms.py \
            --output-dir release-assets/sbom \
            --notices release-assets/sbom/THIRD_PARTY_NOTICES.md

      - name: Package SBOM set
        shell: bash
        run: |
          RELEASE_VERSION=$(python -c "import json; print(json.load(open('release-assets/release-context.json'))['release_version'].lstrip('v'))")
          tar -czf "release-assets/eurogas-nexus-sboms-${RELEASE_VERSION}.tar.gz" -C release-assets sbom

      - name: Build checksums, manifest, then final checksums
        shell: bash
        run: |
          CONTEXT=release-assets/release-context.json
          IMAGE_DIGEST=$(python -c "import json,re; d=json.load(open('release-assets/image-metadata/image-metadata.json'))['digest']; assert re.fullmatch(r'sha256:[0-9a-f]{64}', d), 'invalid image digest'; print(d)")
          python scripts/release/build_release_manifest.py \
            --context "$CONTEXT" \
            --artifacts-dir release-assets \
            --sbom-dir release-assets/sbom \
            --signing-state release-assets/signing-state.json \
            --image-digest "$IMAGE_DIGEST"
          python - <<'PY'
          from scripts.release.release_artifacts import write_checksums
          write_checksums("release-assets", include_manifest=False)
          write_checksums("release-assets", include_manifest=True)
          PY

      - name: Validate complete release bundle
        shell: bash
        run: |
          python scripts/release/validate_release_artifacts.py \
            --context release-assets/release-context.json \
            --artifacts-dir release-assets \
            --sbom-dir release-assets/sbom

      - name: Record checksum evidence
        shell: bash
        run: |
          ENVIRONMENT="github-actions/$(printf '%s/%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          python scripts/release/write_gate_evidence.py \
            --gate-id G12 --status PASS \
            --detail "final SHA256SUMS verified against the assembled bundle" \
            --commit-sha "$GITHUB_SHA" \
            --workflow release.yml --job assemble \
            --environment "$ENVIRONMENT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --artifacts-dir release-assets \
            --subject-artifact SHA256SUMS \
            --output release-assets/release-evidence/checksums.json

      - name: Generate release notes
        shell: bash
        run: |
          python scripts/release/generate_release_notes.py \
            --context release-assets/release-context.json \
            --output release-assets/release-notes.md

      - name: Upload final release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-final
          path: release-assets/*
          if-no-files-found: error

  attest:
    name: Generate GitHub artifact attestations
    runs-on: ubuntu-24.04
    needs: assemble
    if: ${{ needs.assemble.result == 'success' }}
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download final release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-final
          path: release-assets

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/**

  container-acceptance:
    name: Container acceptance by digest
    runs-on: ubuntu-24.04
    needs: runtime-image
    if: ${{ needs.runtime-image.result == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download image metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-metadata
          path: image-metadata

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Inspect immutable digest and platforms
        shell: bash
        run: |
          ENVIRONMENT="github-actions/$(printf '%s/%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          IMAGE=$(python -c "import json; print(json.load(open('image-metadata/image-metadata.json'))['image'])")
          DIGEST=$(python -c "import json; print(json.load(open('image-metadata/image-metadata.json'))['digest'])")
          docker buildx imagetools inspect "$IMAGE@$DIGEST" > inspect.txt
          grep -q 'linux/amd64' inspect.txt
          grep -q 'linux/arm64' inspect.txt
          mkdir -p release-evidence
          python scripts/release/write_gate_evidence.py \
            --gate-id G19 --status PASS \
            --detail "multi-arch digest inspected; amd64 and arm64 present" \
            --commit-sha "$GITHUB_SHA" \
            --workflow release.yml --job container-acceptance \
            --environment "$ENVIRONMENT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --image-digest "$DIGEST" \
            --output release-evidence/container-acceptance.json

      - name: Upload container acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-container-evidence
          path: release-evidence
          if-no-files-found: error

  publish-preview-rc:
    name: Publish preview or RC release
    runs-on: ubuntu-24.04
    needs: [resolve, assemble, attest, container-acceptance]
    if: ${{ always() && needs.resolve.result == 'success' && needs.assemble.result == 'success' && needs.attest.result == 'success' && needs.container-acceptance.result == 'success' && needs.resolve.outputs.channel != 'stable' }}
    # actions: read exists only so the promotion gate below can re-derive G1's
    # same-SHA CI verification from the read-only Actions API with the
    # step-scoped workflow token; no publication path may write releases
    # without that gate passing first.
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download final release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-final
          path: release-assets

      - name: Determine channel and guard stable path
        id: meta
        shell: bash
        run: |
          CONTEXT=release-assets/release-context.json
          CHANNEL=$(python -c "import json; print(json.load(open('$CONTEXT'))['channel'])")
          if [[ "$CHANNEL" == "stable" ]]; then
            echo "Stable releases must use the publish-stable job." >&2
            exit 1
          fi
          TAG=$(python -c "import json; print(json.load(open('$CONTEXT'))['release_version'])")
          echo "tag=$TAG" >> "${GITHUB_OUTPUT}"

      - name: Preview/RC promotion gate
        # The same fail-closed validator that guards stable promotion runs here.
        # A failing gate stops the job before the release write below, so no
        # channel can publish without the evidence its own channel requires for
        # this exact commit and bundle. No bypass flags: a missing or unverified
        # gate blocks rather than publishing ungated.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/validate_stable_release.py \
            --context release-assets/release-context.json \
            --artifacts-dir release-assets \
            --sbom-dir release-assets/sbom \
            --evidence-dir release-assets/release-evidence \
            --repo "${GITHUB_REPOSITORY}"

      - name: Publish immutable prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          gh release create "$TAG" \
            release-assets/*.exe \
            release-assets/*.deb \
            release-assets/*.zip \
            release-assets/*.tar.gz \
            release-assets/release-manifest.json \
            release-assets/SHA256SUMS \
            release-assets/release-notes.md \
            release-assets/signing-state.json \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Eurogas Nexus $TAG" \
            --notes-file release-assets/release-notes.md

  publish-stable:
    name: Publish stable release (fail-closed)
    runs-on: ubuntu-24.04
    needs: [resolve, assemble, attest, container-acceptance]
    if: ${{ always() && needs.resolve.result == 'success' && needs.assemble.result == 'success' && needs.attest.result == 'success' && needs.container-acceptance.result == 'success' && needs.resolve.outputs.channel == 'stable' }}
    environment: production
    permissions:
      contents: write
      # actions: read exists only so the strict gate below can re-derive G1's
      # same-SHA CI verification from the read-only Actions API.
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download final release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-final
          path: release-assets

      - name: Guard stable trigger
        shell: bash
        run: |
          CONTEXT=release-assets/release-context.json
          CHANNEL=$(python -c "import json; print(json.load(open('$CONTEXT'))['channel'])")
          if [[ "$CHANNEL" != "stable" ]]; then
            echo "publish-stable requires a pushed vX.Y.Z tag." >&2
            exit 1
          fi

      - name: Stable promotion gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/validate_stable_release.py \
            --context release-assets/release-context.json \
            --artifacts-dir release-assets \
            --sbom-dir release-assets/sbom \
            --evidence-dir release-assets/release-evidence \
            --repo "${GITHUB_REPOSITORY}" \
            --reject-existing-tag

      - name: Publish immutable stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python -c "import json; print(json.load(open('release-assets/release-context.json'))['release_version'])")
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Stable release $TAG already exists; never overwrite stable artifacts." >&2
            exit 1
          fi
          gh release create "$TAG" \
            release-assets/*.exe \
            release-assets/*.deb \
            release-assets/*.zip \
            release-assets/*.tar.gz \
            release-assets/release-manifest.json \
            release-assets/SHA256SUMS \
            release-assets/release-notes.md \
            release-assets/signing-state.json \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${{ github.sha }}" \
            --latest \
            --title "Eurogas Nexus $TAG" \
            --notes-file release-assets/release-notes.md

  post-publish-verify:
    name: Post-publication verification
    runs-on: ubuntu-24.04
    needs: [publish-preview-rc, publish-stable]
    if: ${{ always() && (needs.publish-preview-rc.result == 'success' || needs.publish-stable.result == 'success') }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-context
          path: release-context

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/post_publish_verify.py \
            --context release-context/release-context.json \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-attestations

  promote-image:
    name: Promote tested image to the preview/RC tag
    runs-on: ubuntu-24.04
    needs: [resolve, post-publish-verify]
    if: ${{ always() && needs.post-publish-verify.result == 'success' && needs.resolve.outputs.channel != 'stable' }}
    # Repository-wide serialization of the promotion read/write: the group is
    # deliberately not ref-scoped and cancellation stays off, so two promotion
    # runs can never inspect-and-write the same package concurrently. The lock
    # cannot prevent an external writer; keeping this workflow the exclusive
    # writer of the package is a documented operational prerequisite.
    concurrency:
      group: eurogas-nexus-image-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      # actions: read exists only for the gate's read-only G1 re-derivation;
      # no other permission is added to this job.
      actions: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download final release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-final
          path: release-assets

      - name: Image promotion gate
        # The same fail-closed validator the publish job ran, on the same
        # bundle, before the registry login and before any tag write: the tag
        # write is behind the gate. No bypass flag exists, and the release must
        # already exist here, so the stable-only reject-existing-tag guard is
        # deliberately not re-applied.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/validate_stable_release.py \
            --context release-assets/release-context.json \
            --artifacts-dir release-assets \
            --sbom-dir release-assets/sbom \
            --evidence-dir release-assets/release-evidence \
            --repo "${GITHUB_REPOSITORY}"

      - name: Confirm the published release exists
        # The release write precedes the tag write and is the state promotion
        # needs; a failed-job rerun keeps the earlier successful publish, so
        # this re-checks the release instead of re-publishing it. No tag is
        # written unless the gate above passed and this release exists.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python -c "import json; print(json.load(open('release-assets/release-context.json'))['release_version'])")
          if ! gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $TAG is not published; refusing to write the channel tag." >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Promote the tested digest to the channel tag
        # Copies the tested multi-platform manifest; never builds and never
        # pushes layers. Conflicts the tool can observe are refused by its
        # policy - the job's registry credential itself could overwrite - and
        # the run fails closed unless the tag re-inspects as the exact tested
        # digest; an external writer racing the check is not excluded.
        shell: bash
        run: |
          mkdir -p promotion-evidence
          CHANNEL_TAG=$(python -c "import json; c=json.load(open('release-assets/release-context.json')); print(c['app_version'] if c['channel'] == 'stable' else c['app_version'] + '-' + c['channel'])")
          python scripts/release/promote_image.py \
            --metadata release-assets/image-metadata/image-metadata.json \
            --tag "$CHANNEL_TAG" \
            --result-output promotion-evidence/promotion-result.json

      - name: Upload promotion result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-promotion-result
          path: promotion-evidence
          if-no-files-found: warn

  promote-image-stable:
    name: Promote tested image to the stable tag (production)
    runs-on: ubuntu-24.04
    needs: [resolve, post-publish-verify]
    if: ${{ always() && needs.post-publish-verify.result == 'success' && needs.resolve.outputs.channel == 'stable' }}
    # Stable promotion keeps the production environment boundary the stable
    # publish used; it never becomes a plain job that writes the stable tag
    # without it.
    environment: production
    # Same repository-wide promotion lock as promote-image: both channels
    # serialize against each other, cancellation off.
    concurrency:
      group: eurogas-nexus-image-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download final release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-final
          path: release-assets

      - name: Image promotion gate
        # Same gate command as the preview/RC promotion: the stable release
        # already exists at this point, so --reject-existing-tag is not passed
        # (a failed-job rerun after release creation must still promote).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/validate_stable_release.py \
            --context release-assets/release-context.json \
            --artifacts-dir release-assets \
            --sbom-dir release-assets/sbom \
            --evidence-dir release-assets/release-evidence \
            --repo "${GITHUB_REPOSITORY}"

      - name: Confirm the published release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python -c "import json; print(json.load(open('release-assets/release-context.json'))['release_version'])")
          if ! gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $TAG is not published; refusing to write the channel tag." >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Promote the tested digest to the channel tag
        shell: bash
        run: |
          mkdir -p promotion-evidence
          CHANNEL_TAG=$(python -c "import json; c=json.load(open('release-assets/release-context.json')); print(c['app_version'] if c['channel'] == 'stable' else c['app_version'] + '-' + c['channel'])")
          python scripts/release/promote_image.py \
            --metadata release-assets/image-metadata/image-metadata.json \
            --tag "$CHANNEL_TAG" \
            --result-output promotion-evidence/promotion-result.json

      - name: Upload promotion result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-promotion-result
          path: promotion-evidence
          if-no-files-found: warn
