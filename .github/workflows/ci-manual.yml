name: Manual CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mirrors `.python-version` / `.nvmrc`; see the note in ci.yml.
  PYTHON_VERSION: "3.11.12"
  NODE_VERSION: "24.13.1"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package from hash-pinned locks
        run: |
          python -m pip install --require-hashes -r requirements-build.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Ruff
        run: ruff check .

      - name: Markdown links
        run: python scripts/ci/check_markdown_links.py

      - name: Configuration contract
        run: python scripts/ci/check_config_contract.py

      - name: Environment templates are current
        run: python scripts/ci/generate_env_template.py --check

      - name: Toolchain versions agree
        run: python scripts/ci/check_toolchain_versions.py

      - name: Configuration preflight (release-shaped environment)
        run: python scripts/ops/check_config.py --env-file scripts/ci/fixtures/release.env --strict

      - name: Tests
        run: pytest -q tests

      - name: Import API
        run: python -c "from apps.api.main import app; print('app import ok'); print(len(app.openapi()['paths']))"

  web-client-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install Web dependencies
        working-directory: clients/web
        run: npm ci

      - name: Build Web client
        working-directory: clients/web
        run: npm run build

      - name: Test Web client
        working-directory: clients/web
        run: npm run test

      - name: Upload Web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eurogas-nexus-web-manual
          path: clients/web/dist
          if-no-files-found: error

  desktop-client-build:
    # Same reusable native pipeline as ordinary CI. No matrix, env, secrets or
    # build steps are copied here; the called workflow is the single definition.
    name: Native desktop build (Windows x64, Linux x64/ARM64)
    uses: ./.github/workflows/native-acceptance.yml

  sdk-installed:
    name: SDK installed-wheel acceptance
    uses: ./.github/workflows/sdk-acceptance.yml

  weather-model-numerical:
    # Same single shared definition as ordinary CI. No inputs, refs, secrets,
    # or write permission are passed from this caller.
    name: Weather model numerical acceptance (internal, NumPy 2.3.5)
    uses: ./.github/workflows/weather-model-acceptance.yml
