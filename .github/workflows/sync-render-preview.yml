name: Sync Render preview

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Serialize all promotions. Older completions are rejected against current main.
concurrency:
  group: sync-render-mobile-preview
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Require successful CI for the current main commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETED_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse origin/main)
          if [[ "$EVENT_NAME" == workflow_run && "$COMPLETED_SHA" != "$source_sha" ]]; then
            echo 'A newer main commit exists; wait for its CI.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$source_sha&per_page=1" --jq '.workflow_runs[0].conclusion // "missing"')
          if [[ "$conclusion" != success ]]; then
            echo "Current main CI is $conclusion; preview unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare merge without overwriting preview changes
        if: steps.source.outputs.sha != ''
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/ci/sync_render_preview.py prepare "$SOURCE_SHA"

      - name: Set up Python from the merged tree
        if: steps.source.outputs.sha != ''
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Set up Node from the merged tree
        if: steps.source.outputs.sha != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies and build the merged web client
        if: steps.source.outputs.sha != ''
        run: |
          python -m pip install --require-hashes -r requirements-build.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          npm --prefix clients/web ci
          npm --prefix clients/web run build
          cp scripts/ci/pre_push_check.sh .git/hooks/pre-push
          chmod +x .git/hooks/pre-push

      - name: Run pre-push gates and publish preview
        if: steps.source.outputs.sha != ''
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python scripts/ci/sync_render_preview.py publish "$SOURCE_SHA"
          echo "Preview contains checked main $SOURCE_SHA. Check Render Events for deployment completion." >> "$GITHUB_STEP_SUMMARY"
