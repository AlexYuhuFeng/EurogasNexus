[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eurogas-nexus"
version = "0.5.0"
description = "European gas market intelligence and resource-pool decision-support platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Eurogas Nexus" }]
dependencies = [
    "fastapi>=0.111,<1.0",
    "pydantic>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "uvicorn>=0.30,<1.0",
    "cryptography>=50.0.1,<51",
    "pg8000>=1.30,<2.0",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0,<7.0",
    "rdflib>=7.0,<8.0",
    "ruff>=0.5,<1.0",
]
research = [
    "pyarrow>=22,<26",
]

[project.scripts]
eurogas-nexus = "eurogas_nexus.cli.main:main"

[tool.setuptools.packages.find]
where = ["src", "packages/python-sdk/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "packages/python-sdk/src", "."]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `.automation/` is the earlier autonomous-development harness, kept in the tree as history
# rather than as product code (it is neither accepted nor reverted by the architecture
# programme). Linting it would report hundreds of style findings in scripts nobody maintains
# and drown the findings that matter in `src/`, `tests/` and `scripts/`.
exclude = [".automation"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter functions are *meant* to be called in a signature default
# (`limit: int = Query(default=50, ge=1, le=500)`); B008 exists to catch a mutable or
# expensive default, which these are not. Declaring them here is the documented way to
# teach the linter the framework idiom instead of silencing the rule.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Header", "fastapi.Path", "fastapi.Body"]

