[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eurogas-nexus"
version = "0.5.0"
description = "European gas market intelligence and resource-pool decision-support platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Eurogas Nexus" }]
dependencies = [
    "fastapi>=0.111,<1.0",
    "pydantic>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "uvicorn>=0.30,<1.0",
    "cryptography>=50.0.1,<51",
    "pg8000>=1.30,<2.0",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Line coverage is release evidence, not a quality score. The reviewed figure comes
    # from the CI `coverage` job and travels with the run, so a reviewer can see which
    # modules the suite actually exercises instead of trusting a summary claim. It is
    # evidence only: no threshold gate is enforced, because a mandated percentage would
    # reward tests written to raise the number rather than to find defects.
    "pytest-cov>=6.0,<8.0",
    "pyyaml>=6.0,<7.0",
    "rdflib>=7.0,<8.0",
    "ruff>=0.5,<1.0",
]
research = [
    "pyarrow>=22,<26",
]

[project.scripts]
eurogas-nexus = "eurogas_nexus.cli.main:main"

[tool.setuptools.packages.find]
where = ["src", "packages/python-sdk/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "packages/python-sdk/src", "."]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `.automation/` is the earlier autonomous-development harness, kept in the tree as history
# rather than as product code (it is neither accepted nor reverted by the architecture
# programme). Linting it would report hundreds of style findings in scripts nobody maintains
# and drown the findings that matter in `src/`, `tests/` and `scripts/`.
#
# The `.dnx-*` entries are local dependency targets (hash-locked installs, a throwaway target
# used to verify the locked install sequence, a build-tool target, a local npm, an embedded
# PostgreSQL and its data directory, and captured test evidence). They are Git-ignored, but ruff
# reads the filesystem rather than Git, so without these entries `ruff check .` reports tens of
# thousands of findings inside third-party packages - which reads as "the project does not lint"
# and hides the real ones.
#
# The glob covers every local working directory in one entry rather than naming them.
# An explicit list has been wrong three times in this repository's remediation: each
# time a new local target was created (.dnx-verify, then .dnx-audit, then .dnx-cov)
# `ruff check .` went red with thousands of findings inside third-party packages, and
# each time the fix was to append one more name. A glob cannot be forgotten.
exclude = [
    ".automation",
    ".dnx-*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter functions are *meant* to be called in a signature default
# (`limit: int = Query(default=50, ge=1, le=500)`); B008 exists to catch a mutable or
# expensive default, which these are not. Declaring them here is the documented way to
# teach the linter the framework idiom instead of silencing the rule.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Header", "fastapi.Path", "fastapi.Body"]

